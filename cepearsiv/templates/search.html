{% extends "base.html" %}

{% block title %}Arama — CepArsiv{% endblock %}

{% block content %}
<div class="page-head">
  <h1>Arama</h1>
</div>

<form
  class="filterbar"
  method="get"
  action="/search"
  hx-get="/search?partial=1"
  hx-target="#search-results"
  hx-swap="outerHTML"
  hx-trigger="submit, input changed delay:500ms from:#search-q"
>
  <input class="form-control" id="search-q" type="search" name="q" value="{{ q }}" placeholder="Ara…" autocomplete="off" style="flex:1;min-width:180px;">
  <select class="form-control" name="type" aria-label="Tür" style="width:auto;">
    <option value="">Tür: Hepsi</option>
    <option value="note" {% if filters.type == 'note' %}selected{% endif %}>Not</option>
    <option value="bookmark" {% if filters.type == 'bookmark' %}selected{% endif %}>Yer imi</option>
    <option value="snippet" {% if filters.type == 'snippet' %}selected{% endif %}>Snippet</option>
  </select>
  <label class="checkline"><input type="checkbox" name="archived" value="0" {% if not filters.archived %}checked{% endif %}> Arşivi hariç tut</label>
  <label class="checkline"><input type="checkbox" name="deleted" value="1" {% if filters.deleted %}checked{% endif %}> Çöpü dahil et</label>
  <button class="btn ghost" type="submit">Ara</button>
</form>

<div id="search-results">
  {% include "partials/search_results.html" %}
</div>
{% endblock %}
