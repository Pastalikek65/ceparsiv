{% extends "base.html" %}

{% block title %}2FA Etkinleştir — CepArsiv{% endblock %}

{% block content %}
<article style="max-width:480px;margin:2rem auto;">
  <h2>İki faktörlü auth</h2>
  <p>Google Authenticator gibi bir TOTP uygulamasıyla girişlerinizi ikinci bir adımla koruyun.</p>
  {% if error %}
  <p style="color:var(--color-error);">{{ error }}</p>
  {% endif %}
  <form method="post" action="/settings/2fa/enable">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="password">Hesap şifreniz
      <input type="password" id="password" name="password" required>
    </label>
    <button type="submit">Başla</button>
  </form>
  <p><a href="/account">← Hesaba dön</a></p>
</article>
{% endblock %}
