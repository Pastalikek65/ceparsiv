{% extends "base.html" %}

{% block title %}2FA Devre Dışı — CepArsiv{% endblock %}

{% block content %}
<article style="max-width:480px;margin:2rem auto;">
  <h2>2FA etkin</h2>
  <p>Devre dışı bırakmak için şifrenizi ve güncel kodunuzu (veya bir yedek kodu) girin.</p>
  {% if error %}
  <p style="color:var(--color-error);">{{ error }}</p>
  {% endif %}
  <form method="post" action="/settings/2fa/disable">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="password">Şifre
      <input type="password" id="password" name="password" required>
    </label>
    <label for="code">TOTP veya yedek kod
      <input type="text" id="code" name="code" autocomplete="off" required>
    </label>
    <button type="submit" class="contrast">Devre dışı bırak</button>
  </form>
  <p><a href="/settings/2fa">← Ayarlar</a> · <a href="/account">Hesap</a></p>
</article>
{% endblock %}
