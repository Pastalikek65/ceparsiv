{% extends "base.html" %}

{% block title %}Kayıt — CepArsiv{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="auth-brand">Cep<em>Arsiv</em></div>
  <div class="card auth-card">
    <h1 style="margin-top:0;">Kayıt</h1>
    {% if error %}
    <div class="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="username">Kullanıcı adı</label>
        <input class="form-control" type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Şifre</label>
        <input class="form-control" type="password" id="password" name="password" autocomplete="new-password" required>
      </div>
      <button class="btn" type="submit" style="width:100%;">Kayıt ol</button>
    </form>
    <p class="small muted" style="margin-top:1rem;">Zaten hesabın var mı? <a href="/login">Giriş yap</a></p>
  </div>
</section>
{% endblock %}
