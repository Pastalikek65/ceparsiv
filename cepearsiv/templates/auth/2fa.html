{% extends "base.html" %}

{% block title %}2FA Kodu — CepArsiv{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="auth-brand">Cep<em>Arsiv</em></div>
  <div class="card auth-card">
    <h1 style="margin-top:0;">İki faktörlü doğrulama</h1>
    {% if error %}
    <div class="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login/2fa">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="code">Tek kullanımlık kod veya yedek kod</label>
        <input class="form-control" type="text" id="code" name="code" autocomplete="off" required autofocus style="font-family:var(--mono);letter-spacing:.3em;text-align:center;">
      </div>
      <button class="btn" type="submit" style="width:100%;">Onayla</button>
    </form>
  </div>
</section>
{% endblock %}
