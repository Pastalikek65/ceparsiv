{% extends "base.html" %}

{% block title %}2FA Kodu — CepArsiv{% endblock %}

{% block content %}
<article style="max-width:420px;margin:2rem auto;">
  <h2>İki faktörlü doğrulama</h2>
  {% if error %}
  <p style="color:var(--color-error);">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login/2fa">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="code">Tek kullanımlık kod veya yedek kod
      <input type="text" id="code" name="code" autocomplete="off" required autofocus>
    </label>
    <button type="submit">Onayla</button>
  </form>
</article>
{% endblock %}
