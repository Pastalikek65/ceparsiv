<!doctype html>
<html lang="tr" data-theme="{% set theme = request.cookies.get("theme") %}{{ theme if theme in ("light", "dark", "auto") else "auto" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#161A1E">
  <title>{% block title %}CepArsiv{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="preload" href="/static/fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/IBMPlexMono-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-user="{% if user %}1{% endif %}">
  {% set csrf_val = (csrf_token if csrf_token is defined else "") or request.cookies.get("csrf_token") %}
  {% if user %}
  <header class="topbar">
    <a class="wordmark" href="/">Cep<em>Arsiv</em></a>
    <form class="search" method="get" action="/search">
      <input class="form-control" type="search" id="topsearch" name="q" placeholder="Ara…  ( / )" autocomplete="off" value="{{ q if q is defined else '' }}">
    </form>
    <span class="spacer"></span>
    <a class="navlink" href="/items">Arşiv</a>
    <a class="navlink" href="/items/new">Yeni</a>
    <a class="navlink text" href="/tags">Etiketler</a>
    <a class="navlink text" href="/account">{{ user.username }}</a>
    <button class="btn ghost small" type="button" id="theme-toggle" title="Tema değiştir">◐</button>
    <form method="post" action="/logout" style="display:inline;margin:0;">
      <input type="hidden" name="csrf_token" value="{{ csrf_val }}">
      <button type="submit" class="btn ghost small">Çıkış</button>
    </form>
  </header>
  {% else %}
  <header class="topbar">
    <a class="wordmark" href="/">Cep<em>Arsiv</em></a>
    <span class="spacer"></span>
    <a class="navlink" href="/login">Giriş</a>
    <a class="navlink" href="/register">Kayıt</a>
  </header>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <div class="toast-wrap" id="toast-wrap"></div>
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
